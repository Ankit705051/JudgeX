version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: judgex-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb+srv://ankit_pandey:705089ap@cluster0.y4z2hbo.mongodb.net/JudgeX
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    networks:
      - judgex-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: judgex-worker
    command: ["npm", "run", "worker"]
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb+srv://ankit_pandey:705089ap@cluster0.y4z2hbo.mongodb.net/JudgeX
      - REDIS_HOST=redis
    depends_on:
      - mongodb
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - code_sandbox_vol:/sandbox
    networks:
      - judgex-network

  mongodb:
    image: mongo:latest
    container_name: judgex-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - judgex-network

  redis:
    image: redis:7.2-alpine
    container_name: judgex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - judgex-network

volumes:
  mongodb_data:
  redis_data:
  code_sandbox_vol:

networks:
  judgex-network:
    driver: bridge

